<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin QR Scanner - Check-In</title>
  <script src="https://unpkg.com/html5-qrcode@2.2.0/dist/html5-qrcode.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue:        #64b5f6;
      --blue-dark:   #42a5f5;
      --bg:          #0d0d0d;
      --surface:     #1a1a1a;
      --surface2:    #222222;
      --border:      #2c2c2c;
      --text:        #f0f0f0;
      --muted:       #888888;
      --danger:      #ff5252;
      --green:       #00e676;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .hero {
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue-dark) 60%, #1e88e5 100%);
      padding: 48px 24px 40px;
      text-align: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(66, 165, 245, 0.15);
    }
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 15% 50%, rgba(255,255,255,0.15) 0%, transparent 50%),
        radial-gradient(circle at 85% 20%, rgba(0,0,0,0.12) 0%, transparent 50%);
      pointer-events: none;
    }
    .hero-badge {
      display: inline-block;
      background: rgba(0,0,0,0.2);
      border: 1px solid rgba(0,0,0,0.3);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      padding: 6px 16px;
      border-radius: 20px;
      margin-bottom: 16px;
    }
    .hero h1 {
      font-size: clamp(24px, 5vw, 40px);
      font-weight: 900;
      color: #fff;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      line-height: 1.1;
    }
    .hero h1 span {
      display: block;
      font-size: 0.42em;
      font-weight: 600;
      letter-spacing: 4px;
      margin-top: 8px;
      opacity: 0.9;
    }

    main {
      flex: 1;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      padding: 32px 16px 48px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    .card-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--blue);
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    #qr-video {
      width: 100%;
      max-width: 400px;
      border-radius: 10px;
      margin: 0 auto 14px;
      display: block;
      border: 2px solid var(--border);
    }

    #scanner-placeholder {
      width: 100%;
      max-width: 400px;
      aspect-ratio: 1;
      margin: 0 auto 14px;
      background: linear-gradient(135deg, rgba(66,165,245,0.1) 0%, rgba(30,136,229,0.05) 100%);
      border: 2px dashed var(--border);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--muted);
      gap: 10px;
    }

    #scanner-input {
      width: 100%;
      padding: 16px;
      background: var(--surface2);
      border: 2px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1px;
      transition: all 0.3s;
      font-family: 'Courier New', monospace;
    }
    #scanner-input:focus {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 16px rgba(66, 165, 245, 0.2);
    }

    .employee-card {
      display: none;
      background: linear-gradient(135deg, rgba(66,165,245,0.08) 0%, rgba(30,136,229,0.04) 100%);
      border: 1.5px solid var(--blue);
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .emp-info-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid rgba(66, 165, 245, 0.2);
    }
    .emp-info-row:last-child { border-bottom: none; }
    .emp-label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .emp-value {
      font-size: 14px;
      color: var(--blue);
      font-weight: 700;
    }

    .alert {
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 18px;
      border-left: 4px solid;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .alert-error { 
      background: rgba(255,82,82,0.12);  
      border-left-color: var(--danger);
      color: #ff8a80; 
    }
    .alert-success { 
      background: rgba(0,230,118,0.12);  
      border-left-color: var(--green);
      color: var(--green); 
    }

    .btn-row {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 32px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      flex: 1;
      justify-content: center;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue-dark) 100%);
      color: #fff;
      box-shadow: 0 4px 12px rgba(66, 165, 245, 0.2);
    }
    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(66, 165, 245, 0.3);
    }
    .btn-primary:disabled { 
      background: #333; 
      color: #555; 
      cursor: not-allowed; 
      opacity: 0.6;
    }
    .btn-outline {
      background: transparent;
      border: 1.5px solid var(--border);
      color: var(--muted);
    }
    .btn-outline:hover {
      border-color: var(--blue);
      color: var(--blue);
      background: rgba(66, 165, 245, 0.08);
    }

    .log-section { margin-top: 28px; }
    .log-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--blue);
      margin-bottom: 14px;
    }
    .log-wrap {
      max-height: 300px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: linear-gradient(135deg, rgba(66,165,245,0.02) 0%, rgba(30,136,229,0.01) 100%);
    }
    .log-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
    }
    .log-item:last-child { border-bottom: none; }
    
    .log-status {
      font-weight: 800;
      font-size: 10px;
      padding: 3px 9px;
      border-radius: 6px;
      letter-spacing: 1.5px;
      flex-shrink: 0;
      min-width: 70px;
      text-align: center;
      text-transform: uppercase;
      background: rgba(0,230,118,0.2);
      color: var(--green);
    }
    .log-badge {
      background: rgba(66,165,245,0.15);
      border: 1px solid var(--blue);
      color: var(--blue);
      font-size: 11px;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 6px;
      letter-spacing: 1px;
    }
    .log-meta { color: var(--muted); margin-left: auto; }

    .spinner {
      width: 14px; height: 14px;
      border: 2px solid rgba(66,165,245,0.2);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    footer {
      text-align: center;
      padding: 20px 16px;
      font-size: 11px;
      color: var(--border);
      border-top: 1px solid var(--border);
      margin-top: auto;
    }
    footer span { color: var(--blue); font-weight: 700; }

    .divider {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin: 16px 0;
      padding: 10px 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    #html5-qrcode { width: 100% !important; }
    
    @media (max-width: 480px) {
      main { padding: 24px 12px 40px; }
      .card { padding: 18px 14px; }
      .btn { padding: 12px 16px; font-size: 13px; }
    }
  </style>
</head>
<body>

<header class="hero">
  <div class="hero-badge">🔐 Admin Only</div>
  <h1>Employee Check-In
    <span>QR Code Scanner</span>
  </h1>
</header>

<main>

  <div class="card">
    <div class="card-title">
      <span style="font-size: 24px;">📱</span>
      QR Code Scanner
    </div>

    <div id="alert-zone"></div>

    <!-- QR Scanner -->
    <div id="qr-video"></div>
    <div id="scanner-placeholder">
      <div style="font-size: 48px;">📷</div>
      <span id="scanner-status">Ready to scan</span>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" id="btn-start-camera">
        🎥 Start Scanner
      </button>
      <button class="btn btn-outline" id="btn-stop-camera" style="display: none;">
        ⏹ Stop
      </button>
    </div>

    <div class="divider">Or enter manually</div>

    <input 
      type="text" 
      id="scanner-input" 
      placeholder="Enter Employee ID"
      autocomplete="off"
    />

    <!-- Employee Info -->
    <div class="employee-card" id="employee-card">
      <div class="emp-info-row">
        <span class="emp-label">Employee ID</span>
        <span class="emp-value" id="emp-id">—</span>
      </div>
      <div class="emp-info-row">
        <span class="emp-label">Check-In Time</span>
        <span class="emp-value" id="emp-time">—</span>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" id="btn-confirm" disabled>
        ✓ Confirm Check-In
      </button>
      <button class="btn btn-outline" id="btn-clear">
        ✕ Clear
      </button>
    </div>
  </div>

  <!-- Activity Log -->
  <div class="card log-section">
    <div class="log-title">📋 Today's Check-Ins</div>
    <div class="log-wrap" id="log-wrap">
      <div style="padding: 20px; text-align: center; color: var(--muted); font-size: 12px;">
        No check-ins yet
      </div>
    </div>
  </div>

</main>

<footer>
  &copy; <span id="yr"></span> &mdash; Admin Check-In System
</footer>

<script>
  document.getElementById('yr').textContent = new Date().getFullYear();

  let currentEmployee = null;
  let todayCheckIns = [];

  const scannerInput = document.getElementById('scanner-input');
  const employeeCard = document.getElementById('employee-card');
  const empId = document.getElementById('emp-id');
  const empTime = document.getElementById('emp-time');
  const btnConfirm = document.getElementById('btn-confirm');
  const btnClear = document.getElementById('btn-clear');
  const btnStartCamera = document.getElementById('btn-start-camera');
  const btnStopCamera = document.getElementById('btn-stop-camera');
  const scannerPlaceholder = document.getElementById('scanner-placeholder');
  const alertZone = document.getElementById('alert-zone');
  const logWrap = document.getElementById('log-wrap');

  window.addEventListener('load', () => {
    loadTodayCheckIns();
  });

  // Camera Scanner
  btnStartCamera.addEventListener('click', startCamera);
  btnStopCamera.addEventListener('click', stopCamera);

  function startCamera() {
    try {
      clearAlert();
      
      // Create a blob URL with proper permissions
      const scannerHTML = `<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Permissions-Policy" content="camera=*">
<title>QR Scanner</title>
<script src="https://unpkg.com/html5-qrcode@2.2.0/dist/html5-qrcode.min.js"><\/script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; font-family: Arial; }
#qr { width: 100vw; height: 100vh; }
#status { position: fixed; top: 10px; left: 10px; color: #fff; background: rgba(0,0,0,0.7); padding: 10px 15px; border-radius: 5px; z-index: 999; }
.close-btn { position: fixed; top: 10px; right: 10px; background: #ff5252; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; z-index: 1000; font-weight: bold; }
</style>
</head>
<body>
<div id="status">📷 Point at QR Code</div>
<button class="close-btn" onclick="window.close()">✕ Close</button>
<div id="qr"></div>
<script>
function startScanning() {
  const html5QrCode = new Html5Qrcode("qr");
  html5QrCode.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 250, height: 250 } },
    (decodedText) => {
      window.opener.postMessage({type: 'QR_SCANNED', data: decodedText}, '*');
      html5QrCode.stop();
      window.close();
    },
    (error) => {
      document.getElementById('status').textContent = '🔄 Scanning...';
    }
  ).catch(err => {
    alert('Camera Error: ' + err);
    window.close();
  });
}
setTimeout(startScanning, 500);
<\/script>
</body>
</html>`;

      const blob = new Blob([scannerHTML], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      
      const scannerWindow = window.open(url, 'qr_scanner', 'width=500,height=700,menubar=no,toolbar=no');
      
      // Listen for messages from scanner window
      window.addEventListener('message', function handleMessage(event) {
        if (event.data && event.data.type === 'QR_SCANNED') {
          scannerInput.value = event.data.data;
          lookupEmployee(event.data.data);
          window.removeEventListener('message', handleMessage);
        }
      });
      
      showAlert('✓ Scanner window opened. Granting camera access...', 'success');
      btnStartCamera.style.display = 'none';
      btnStopCamera.style.display = 'block';
      
    } catch (err) {
      showAlert('Error: ' + err.message, 'error');
    }
  }

  function stopCamera() {
    btnStartCamera.style.display = 'block';
    btnStopCamera.style.display = 'none';
  }

  // Manual Entry
  scannerInput.addEventListener('keyup', (e) => {
    if (e.key === 'Enter' && scannerInput.value.trim()) {
      lookupEmployee(scannerInput.value.trim());
    }
  });

  // Employee Lookup
  function lookupEmployee(employeeId) {
    clearAlert();
    scannerInput.disabled = true;
    btnConfirm.disabled = true;

    google.script.run
      .withSuccessHandler(onEmployeeFound)
      .withFailureHandler(err => {
        showAlert('Error: ' + err.message, 'error');
        scannerInput.disabled = false;
      })
      .scannerGetEmployeeInfo(employeeId);
  }

  function onEmployeeFound(employee) {
    scannerInput.disabled = false;

    if (!employee || employee.error) {
      showAlert(employee?.error || 'Employee not found.', 'error');
      employeeCard.style.display = 'none';
      currentEmployee = null;
      btnConfirm.disabled = true;
      return;
    }

    currentEmployee = employee;
    empId.textContent = employee.employeeId || '—';
    empTime.textContent = new Date().toLocaleTimeString();
    employeeCard.style.display = 'block';
    btnConfirm.disabled = false;
    showAlert('✓ Employee found! Click "Confirm Check-In".', 'success');
  }

  // Confirm Check-In
  btnConfirm.addEventListener('click', () => {
    if (!currentEmployee) return;
    btnConfirm.disabled = true;
    btnConfirm.innerHTML = '<span class="spinner"></span> Logging…';

    google.script.run
      .withSuccessHandler(onCheckInLogged)
      .withFailureHandler(err => {
        showAlert('Check-in failed: ' + err.message, 'error');
        btnConfirm.disabled = false;
        btnConfirm.innerHTML = '✓ Confirm Check-In';
      })
      .logCheckIn(currentEmployee.employeeId);
  });

  function onCheckInLogged(result) {
    if (result.error) {
      showAlert('Failed to log: ' + result.error, 'error');
      btnConfirm.disabled = false;
      btnConfirm.innerHTML = '✓ Confirm Check-In';
      return;
    }

    showAlert('✓ Check-in logged!', 'success');
    const checkIn = {
      employeeId: currentEmployee.employeeId,
      checkInTime: new Date().toLocaleTimeString()
    };
    todayCheckIns.unshift(checkIn);
    updateLogDisplay();
    setTimeout(clearForm, 500);
  }

  // Clear Form
  btnClear.addEventListener('click', clearForm);

  function clearForm() {
    scannerInput.value = '';
    employeeCard.style.display = 'none';
    currentEmployee = null;
    btnConfirm.disabled = true;
    btnConfirm.innerHTML = '✓ Confirm Check-In';
    clearAlert();
    scannerInput.focus();
  }

  // Load Today's Check-Ins
  function loadTodayCheckIns() {
    google.script.run
      .withSuccessHandler(checkIns => {
        todayCheckIns = checkIns || [];
        updateLogDisplay();
      })
      .withFailureHandler(() => {
        todayCheckIns = [];
      })
      .getTodayCheckIns();
  }

  // Update Log Display
  function updateLogDisplay() {
    if (todayCheckIns.length === 0) {
      logWrap.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--muted); font-size: 12px;">No check-ins yet</div>';
      return;
    }

    logWrap.innerHTML = todayCheckIns.map(checkin => `
      <div class="log-item">
        <span class="log-status">✓ IN</span>
        <span class="log-badge">${esc(checkin.employeeId)}</span>
        <span class="log-meta">${checkin.checkInTime}</span>
      </div>
    `).join('');
  }

  // Utilities
  function showAlert(msg, type) {
    alertZone.innerHTML = `<div class="alert alert-${type}">${esc(msg)}</div>`;
  }

  function clearAlert() {
    alertZone.innerHTML = '';
  }

  function esc(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
</script>
</body>
</html>
