<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Code Scanner</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/dist/html5-qrcode.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --blue: #64b5f6;
      --bg: #0d0d0d;
      --surface: #1a1a1a;
      --border: #2c2c2c;
      --text: #f0f0f0;
      --green: #00e676;
      --danger: #ff5252;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: linear-gradient(135deg, var(--blue) 0%, #42a5f5 100%);
      padding: 24px;
      text-align: center;
      color: #fff;
    }
    .header h1 {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    main {
      flex: 1;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    #html5-qrcode {
      width: 100% !important;
      border-radius: 10px;
    }

    .alert {
      padding: 14px 16px;
      border-radius: 10px;
      margin-bottom: 16px;
      border-left: 4px solid;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .alert-error {
      background: rgba(255,82,82,0.12);
      border-left-color: var(--danger);
      color: #ff8a80;
    }
    .alert-success {
      background: rgba(0,230,118,0.12);
      border-left-color: var(--green);
      color: var(--green);
    }
    .alert-info {
      background: rgba(100,181,246,0.12);
      border-left-color: var(--blue);
      color: var(--blue);
    }

    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      flex-wrap: wrap;
    }
    button {
      flex: 1;
      min-width: 120px;
      padding: 14px 20px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .btn-primary {
      background: var(--blue);
      color: #fff;
      box-shadow: 0 4px 12px rgba(100,181,246,0.2);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(100,181,246,0.3);
    }
    .btn-primary:disabled {
      background: #333;
      color: #555;
      cursor: not-allowed;
      opacity: 0.6;
    }

    .status {
      font-size: 14px;
      color: var(--text);
      text-align: center;
      margin-top: 12px;
    }

    .instructions {
      background: linear-gradient(135deg, rgba(100,181,246,0.1) 0%, rgba(30,136,229,0.05) 100%);
      border: 1px solid rgba(100,181,246,0.2);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 20px;
      font-size: 13px;
      color: var(--text);
      line-height: 1.6;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(100,181,246,0.2);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    footer {
      text-align: center;
      padding: 16px;
      font-size: 11px;
      color: var(--border);
      margin-top: 20px;
    }

    @media (max-width: 480px) {
      .header h1 { font-size: 18px; }
      main { padding: 16px 12px; }
      .card { padding: 16px; }
      button { padding: 12px 16px; font-size: 13px; }
    }
  </style>
</head>
<body>

<header class="header">
  <h1>📱 QR Code Scanner</h1>
</header>

<main>
  <div class="card">
    <div class="instructions">
      ✓ Point your phone camera at a QR code
      <br>✓ The code will scan automatically
      <br>✓ Results will be sent to the server
    </div>

    <div id="alert-zone"></div>

    <div id="html5-qrcode"></div>

    <div class="button-group">
      <button class="btn-primary" id="btn-start" onclick="startScanning()">
        🎥 Start Scanning
      </button>
      <button class="btn-primary" id="btn-stop" onclick="stopScanning()" style="display: none;">
        ⏹ Stop
      </button>
    </div>

    <div class="status" id="status"></div>
  </div>
</main>

<footer>
  🔒 Secure QR Scanner | Powered by html5-qrcode
</footer>

<script>
  // Replace with your Apps Script Web App URL
  const APPS_SCRIPT_URL = 'YOUR_APPS_SCRIPT_WEB_APP_URL_HERE';

  let html5QrCode = null;
  let isScanning = false;
  let lastScannedCode = null;
  let lastScanTime = 0;

  function showAlert(msg, type = 'info') {
    const zone = document.getElementById('alert-zone');
    zone.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
  }

  function clearAlert() {
    document.getElementById('alert-zone').innerHTML = '';
  }

  function updateStatus(msg) {
    document.getElementById('status').textContent = msg;
  }

  async function startScanning() {
    try {
      clearAlert();
      updateStatus('🔄 Initializing camera...');
      document.getElementById('btn-start').disabled = true;

      html5QrCode = new Html5Qrcode("html5-qrcode", false);

      const config = {
        fps: 10,
        qrbox: { width: 250, height: 250 },
        aspectRatio: 1.0,
        disableFlip: false
      };

      await html5QrCode.start(
        { facingMode: "environment" },
        config,
        onScanSuccess,
        onScanError
      );

      isScanning = true;
      document.getElementById('btn-start').style.display = 'none';
      document.getElementById('btn-stop').style.display = 'block';
      showAlert('✓ Camera active. Point at QR code.', 'success');
      updateStatus('📷 Ready to scan');

    } catch (error) {
      showAlert('❌ Camera error: ' + error.message, 'error');
      document.getElementById('btn-start').disabled = false;
      updateStatus('Failed to start camera');
    }
  }

  function onScanSuccess(decodedText, decodedResult) {
    const now = Date.now();

    // Prevent duplicate scans within 2 seconds
    if (decodedText === lastScannedCode && (now - lastScanTime) < 2000) {
      return;
    }

    lastScannedCode = decodedText;
    lastScanTime = now;

    updateStatus(`✓ Scanned: ${decodedText}`);
    playBeep();
    sendToAppScript(decodedText);
  }

  function onScanError(error) {
    // Silent error handling - just suppress
  }

  function playBeep() {
    try {
      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();

      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);

      oscillator.frequency.value = 800;
      oscillator.type = 'sine';

      gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);

      oscillator.start(audioContext.currentTime);
      oscillator.stop(audioContext.currentTime + 0.1);
    } catch (e) {
      // Audio not supported
    }
  }

  async function sendToAppScript(qrCode) {
    try {
      updateStatus('📤 Sending to server...');

      const payload = {
        employeeId: qrCode,
        timestamp: new Date().toISOString()
      };

      const response = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        body: JSON.stringify(payload)
      });

      updateStatus('✓ Sent! Scan another code or close this window.');
      showAlert('✓ Data sent to server successfully!', 'success');

    } catch (error) {
      showAlert('❌ Failed to send: ' + error.message, 'error');
      updateStatus('Failed to send data');
    }
  }

  function stopScanning() {
    if (html5QrCode) {
      html5QrCode.stop().then(() => {
        html5QrCode = null;
        isScanning = false;
        document.getElementById('btn-start').style.display = 'block';
        document.getElementById('btn-stop').style.display = 'none';
        document.getElementById('btn-start').disabled = false;
        clearAlert();
        updateStatus('Scanner stopped');
      });
    }
  }

  // Auto-start scanning on page load
  window.addEventListener('load', () => {
    startScanning();
  });
</script>
</body>
</html>
